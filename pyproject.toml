[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devtools"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["repo_xray", "askdata", "jsondiff", "loglens", "gitarch", "testdelta", "envcontract", "keycheck"]

[project.scripts]
repo-xray = "repo_xray.cli:main"
askdata = "askdata.cli:main"
jsondiff = "jsondiff.cli:main"
loglens = "loglens.cli:main"
gitarch = "gitarch.cli:main"
testdelta = "testdelta.cli:main"
envcontract = "envcontract.cli:main"
keycheck = "keycheck.cli:main"

[tool.repo-xray]
independent = ["repo_xray", "askdata", "jsondiff", "loglens", "gitarch", "testdelta", "envcontract", "keycheck"]
